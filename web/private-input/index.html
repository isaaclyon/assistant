<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Private browser input</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/app.js" defer></script>
</head>
<body><main>
  <p class="eyebrow">ASSISTANT · PRIVATE INPUT</p><h1>Continue signing in</h1>
  <p id="destination">Verifying your Telegram identity…</p>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="input" autocomplete="off"><div id="fields"></div>
    <button id="submit" type="submit" disabled>Fill and submit sign-in form</button>
    <button id="cancel" type="button" disabled>Cancel</button>
  </form>
  <p class="note">Values go directly to the website shown above through the assistant’s browser. They are not sent as chat messages. This request expires in 10 minutes.</p>
</main></body></html>
