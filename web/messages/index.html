<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Open Messages</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(32rem, calc(100% - 2rem)); }
      h1, .note { text-align: center; }
      label { display: block; margin-bottom: .5rem; font-weight: 600; }
      textarea { box-sizing: border-box; width: 100%; min-height: 9rem; padding: .8rem;
        border: 1px solid #8888; border-radius: .7rem; font: inherit; resize: vertical; }
      button { display: block; width: 100%; margin-top: 1rem; padding: .85rem 1.2rem;
        border: 0; border-radius: .7rem; background: #0a84ff; color: white;
        font: inherit; font-weight: 650; }
      #error { color: #d70015; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>Review message</h1>
      <label for="message">Edit before opening Messages</label>
      <textarea id="message" maxlength="5000"></textarea>
      <p id="error" hidden>Invalid or missing phone number. Ask for a new link.</p>
      <button id="open" type="button" hidden disabled>Open Messages</button>
      <p class="note">Messages opens only after you tap. Sending is a separate action.</p>
    </main>
    <script type="module" src="./messages-link.js"></script>
  </body>
</html>
