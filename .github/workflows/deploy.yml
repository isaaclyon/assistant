name: Native runtime checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main and pull requests validate the native release. Deployment requires an
# explicit staged administrator invocation; merges must never restart the fleet.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the native revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install repository inspection prerequisite
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - run: npm ci --no-audit --no-fund
      - name: Check native types, compatibility, recovery, and behavior
        run: npm run check:changed
      - run: npm run build
